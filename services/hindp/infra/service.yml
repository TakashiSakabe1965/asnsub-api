AWSTemplateFormatVersion: "2010-09-09"
Description: asnsub service stack (ECS Service + TargetGroup + ALB rule)

Parameters:
  BaseStackName:
    Type: String
    Description: "Base stack name (e.g., asnsub-base-dev)"
  ServiceName:
    Type: String
    Description: "Service identifier (e.g., hindp)"
  ContainerImage:
    Type: String
    Description: "ECR image URI (e.g., 123.dkr.ecr.ap-northeast-1.amazonaws.com/asnsub-hindp:latest)"
  AssignPublicIp:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
  Subnet1:
    Type: AWS::EC2::Subnet::Id
  Subnet2:
    Type: AWS::EC2::Subnet::Id
  VpcId:
    Type: AWS::EC2::VPC::Id
  EcsTaskSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ListenerPriority:
    Type: Number
    Default: 10

Resources:
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ServiceName}-tg"
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200"

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${BaseStackName}-ListenerArn"
      Priority: !Ref ListenerPriority
      Conditions:
        - Field: path-pattern
          Values:
            - !Sub "/api/${ServiceName}*"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ServiceName}-task"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${ServiceName}"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ServiceName}"
      RetentionInDays: 14

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      Cluster: !ImportValue
        Fn::Sub: "${BaseStackName}-ClusterName"
      ServiceName: !Sub "${ServiceName}-svc"
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: [!Ref Subnet1, !Ref Subnet2]
          SecurityGroups: [!Ref EcsTaskSecurityGroupId]
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: !Ref ServiceName
          ContainerPort: 3000

Outputs:
  TargetGroupArn:
    Value: !Ref TargetGroup
  ServiceName:
    Value: !Ref Service
