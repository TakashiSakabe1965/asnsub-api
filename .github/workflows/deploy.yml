name: Deploy HINDP only (final)

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/deploy.yml"
      - "services/hindp/**"

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: asnsub-hindp
  STACK_NAME: asnsub-hindp-dev
  BASE_STACK: asnsub-base-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/hindp

    steps:
      - uses: actions/checkout@v4

      # ✅ 固定 IAM キー（OIDC 使用しない）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          REG=${{ steps.login.outputs.registry }}
          docker build -t $REG/${ECR_REPO}:latest .
          docker push $REG/${ECR_REPO}:latest

      - name: Deploy CloudFormation
        env:
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET1: ${{ secrets.SUBNET1 }}
          SUBNET2: ${{ secrets.SUBNET2 }}
          ECS_SG_ID: ${{ secrets.ECS_SG_ID }}
          ASSIGN_PUBLIC_IP: ${{ secrets.ASSIGN_PUBLIC_IP }}
        run: |
          REG=${{ steps.login.outputs.registry }}

          aws cloudformation deploy \
            --template-file infra/service.yml \
            --stack-name ${STACK_NAME} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BaseStackName=${BASE_STACK} \
              ServiceName=hindp \
              ContainerImage=$REG/${ECR_REPO}:latest \
              ListenerPriority=10 \
              VpcId=$VPC_ID \
              Subnet1=$SUBNET1 \
              Subnet2=$SUBNET2 \
              EcsTaskSecurityGroupId=$ECS_SG_ID \
              AssignPublicIp=$ASSIGN_PUBLIC_IP