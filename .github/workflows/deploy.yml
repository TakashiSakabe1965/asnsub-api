name: Deploy asnsub API (dev auto / manual)

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/deploy.yml"
      - "services/hindp/**"
      - "services/hinfl/**"
      - "services/hinpr/**"
  workflow_dispatch:
    inputs:
      service:
        description: "service (hindp/hinfl/hinpr)"
        required: true
        type: choice
        options: [hindp, hinfl, hinpr]
      env:
        description: "environment"
        required: true
        default: dev
        type: choice
        options: [dev, stg, prod]

permissions:
  id-token: write
  contents: read

env:
  ECR_PREFIX: asnsub-
  STACK_PREFIX: asnsub-
  BASE_STACK_PREFIX: asnsub-base

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # push時はこの3つを必ず回す（今日中に終わらせるため）
          - service: hindp
            priority: 10
          - service: hinfl
            priority: 20
          - service: hinpr
            priority: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set target (push/manual)
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "service=${{ inputs.service }}" >> "$GITHUB_OUTPUT"
            echo "env=${{ inputs.env }}" >> "$GITHUB_OUTPUT"
          else
            echo "service=${{ matrix.service }}" >> "$GITHUB_OUTPUT"
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure ECR repo
        shell: bash
        run: |
          set -euo pipefail
          REPO="${ECR_PREFIX}${{ steps.target.outputs.service }}"
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$REPO" >/dev/null

      - name: Build & push image
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="${{ steps.target.outputs.service }}"
          REG="${{ steps.login.outputs.registry }}"
          REPO="${ECR_PREFIX}${SERVICE}"

          docker build -t "$REG/$REPO:latest" "services/$SERVICE"
          docker push "$REG/$REPO:latest"

      - name: Deploy CloudFormation (Service Stack)
        shell: bash
        env:
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET1: ${{ secrets.SUBNET1 }}
          SUBNET2: ${{ secrets.SUBNET2 }}
          ECS_SG_ID: ${{ secrets.ECS_SG_ID }}
          ASSIGN_PUBLIC_IP: ${{ secrets.ASSIGN_PUBLIC_IP }}
        run: |
          set -euo pipefail
          SERVICE="${{ steps.target.outputs.service }}"
          ENVNAME="${{ steps.target.outputs.env }}"
          REG="${{ steps.login.outputs.registry }}"
          REPO="${ECR_PREFIX}${SERVICE}"
          IMAGE="$REG/$REPO:latest"

          STACK_NAME="${STACK_PREFIX}${SERVICE}-${ENVNAME}"
          BASE_STACK="${BASE_STACK_PREFIX}-${ENVNAME}"

          # priority：push時は matrix の固定値、手動時はサービス別に固定（簡易）
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$SERVICE" == "hindp" ]]; then PRIO=10
            elif [[ "$SERVICE" == "hinfl" ]]; then PRIO=20
            else PRIO=30
            fi
          else
            PRIO="${{ matrix.priority }}"
          fi

          aws cloudformation deploy \
            --template-file "services/$SERVICE/infra/service.yml" \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BaseStackName="$BASE_STACK" \
              ServiceName="$SERVICE" \
              ContainerImage="$IMAGE" \
              ListenerPriority="$PRIO" \
              VpcId="$VPC_ID" \
              Subnet1="$SUBNET1" \
              Subnet2="$SUBNET2" \
              EcsTaskSecurityGroupId="$ECS_SG_ID" \
              AssignPublicIp="$ASSIGN_PUBLIC_IP"