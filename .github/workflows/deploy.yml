name: Deploy APIs to ECS

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECS_CLUSTER: asnsub-api-ecs

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        api:
          - name: hindp
            dir: services/hindp
            ecr: asnsub-hindp
            ecs_service: asnsub-api-hindp-v2
          - name: hinpr
            dir: services/hinpr
            ecr: asnsub-hinpr
            ecs_service: asnsub-api-hinpr-v2
          # ↓ 追加する時はここに書くだけ
          # - name: hinfl
          #   dir: services/hinfl
          #   ecr: asnsub-hinfl
          #   ecs_service: asnsub-api-hinfl-v2

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        working-directory: ${{ matrix.api.dir }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t ${{ matrix.api.ecr }}:latest .
          docker tag ${{ matrix.api.ecr }}:latest $ECR_REGISTRY/${{ matrix.api.ecr }}:latest
          docker push $ECR_REGISTRY/${{ matrix.api.ecr }}:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service ${{ matrix.api.ecs_service }} \
            --force-new-deployment