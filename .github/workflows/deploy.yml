name: Deploy asnsub API (dev auto / stg-prod manual)除外）
            SERVICES="$(ls -1 services | grep -v '^backup$' | tr '\n' ' ')"
          fi

          # 何も無ければ空 matrix
          if [[ -z "${SERVICES// }" ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Python で安全に matrix JSON を生成（クォート崩れ防止）
          MATRIX_JSON=$(python3 - << 'PY'
import json, os
services = os.environ["SERVICES"].split()
print(json.dumps({"include":[{"service":s} for s in services]}))
PY
          )

          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
        env:
          SERVICES: ""  # ここは run 内で上書きされます（安全のためのダミー）

  deploy:
    needs: detect
    if: ${{ fromJson(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    concurrency:
      group: deploy-${{ matrix.service }}-${{ needs.detect.outputs.deploy_env }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repo
        shell: bash
        run: |
          set -euo pipefail
          REPO="${ECR_PREFIX}${{ matrix.service }}"
          aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$REPO" >/dev/null

      - name: Build and push Docker image
        shell: bash
        run: |
          set -euo pipefail
          REG="${{ steps.login-ecr.outputs.registry }}"
          REPO="${ECR_PREFIX}${{ matrix.service }}"
          docker build -t "$REG/$REPO:latest" .
          docker push "$REG/$REPO:latest"

      # priority 衝突回避（HINDP/HINFL/HINPR は固定、それ以外はハッシュで決定）
      - name: Calculate listener priority
        id: prio
        shell: bash
        run: |
          set -euo pipefail
          S="${{ matrix.service }}"
          if [[ "$S" == "hindp" ]]; then P=10
          elif [[ "$S" == "hinfl" ]]; then P=20
          elif [[ "$S" == "hinpr" ]]; then P=30
          else
            P=$(python3 - << 'PY'
import zlib, os
s=os.environ["S"].encode("utf-8")
v=zlib.crc32(s) % 40000
print(1000 + v)  # 1000-40999 の範囲
PY
            )
          fi
          echo "value=$P" >> "$GITHUB_OUTPUT"
        env:
          S: ${{ matrix.service }}

      - name: Deploy CloudFormation (Service Stack)
        shell: bash
        env:
          STACK_NAME: ${{ env.STACK_PREFIX }}${{ matrix.service }}-${{ needs.detect.outputs.deploy_env }}
          BASE_STACK: ${{ env.BASE_STACK_PREFIX }}-${{ needs.detect.outputs.deploy_env }}
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET1: ${{ secrets.SUBNET1 }}
          SUBNET2: ${{ secrets.SUBNET2 }}
          ECS_SG_ID: ${{ secrets.ECS_SG_ID }}
          ASSIGN_PUBLIC_IP: ${{ secrets.ASSIGN_PUBLIC_IP }}
        run: |
          set -euo pipefail
          REG="${{ steps.login-ecr.outputs.registry }}"
          REPO="${ECR_PREFIX}${{ matrix.service }}"
          IMAGE="$REG/$REPO:latest"

          aws cloudformation deploy \
            --template-file infra/service.yml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BaseStackName="$BASE_STACK" \
              ServiceName="${{ matrix.service }}" \
              ContainerImage="$IMAGE" \
              AssignPublicIp="$ASSIGN_PUBLIC_IP" \
              VpcId="$VPC_ID" \
              Subnet1="$SUBNET1" \
              Subnet2="$SUBNET2" \
              EcsTaskSecurityGroupId="$ECS_SG_ID" \
              ListenerPriority="${{ steps.prio.outputs.value }}"
``

on:
  push:
    branches: [ main ]
    paths:
      - "services/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "deploy service name (hindp / hinfl / hinpr ...) 空なら全サービス"
        required: false
        type: string
      env:
        description: "deploy environment"
        required: true
        default: dev
        type: choice
        options: [dev, stg, prod]

permissions:
  id-token: write
  contents: read

env:
  ECR_PREFIX: asnsub-
  STACK_PREFIX: asnsub-
  BASE_STACK_PREFIX: asnsub-base

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      deploy_env: ${{ steps.mk.outputs.deploy_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # push のときだけ、変更が入った services/<name> を抽出
      - name: Get changed service dirs (push)
        if: github.event_name == 'push'
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          dir_names: true
          dir_names_max_depth: 2
          files: |
            services/**

      - name: Build matrix
        id: mk
        shell: bash
        run: |
          set -euo pipefail

          # deploy_env 決定：push=dev、手動=inputs.env
          if [[ "${{ github.event_name }}" == "push" ]]; then
            DEPLOY_ENV="dev"
          else
            DEPLOY_ENV="${{ inputs.env }}"
          fi

          # 対象サービス決定
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.service }}" ]]; then
            SERVICES="${{ inputs.service }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            SERVICES=""
            for d in ${{ steps.changed.outputs.all_changed_files }}; do
              if [[ "$d" =~ ^services/[^/]+$ ]]; then
                s="${d#services/}"
                [[ "$s" == "backup" ]] && continue
                SERVICES="${SERVICES} ${s}"
              fi
            done
            SERVICES="$(echo "${SERVICES}" | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')"
          else
