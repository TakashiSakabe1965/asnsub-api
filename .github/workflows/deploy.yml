name: Deploy asnsub API (manual stable)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "service name (hindp / hinfl / hinpr)"
        required: true
        type: string
      env:
        description: "environment"
        required: true
        default: dev
        type: choice
        options: [dev, stg, prod]
      listener_priority:
        description: "ALB rule priority (10 / 20 / 30)"
        required: true
        default: "10"
        type: string

permissions:
  id-token: write
  contents: read

env:
  ECR_PREFIX: asnsub-
  STACK_PREFIX: asnsub-
  BASE_STACK_PREFIX: asnsub-base

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repo
        shell: bash
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "${ECR_PREFIX}${{ inputs.service }}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${ECR_PREFIX}${{ inputs.service }}" >/dev/null

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          REG="${{ steps.login.outputs.registry }}"
          REPO="${ECR_PREFIX}${{ inputs.service }}"
          docker build -t "$REG/$REPO:latest" .
          docker push "$REG/$REPO:latest"

      - name: Deploy CloudFormation
        shell: bash
        env:
          STACK_NAME: ${{ env.STACK_PREFIX }}${{ inputs.service }}-${{ inputs.env }}
          BASE_STACK: ${{ env.BASE_STACK_PREFIX }}-${{ inputs.env }}
          VPC_ID: ${{ secrets.VPC_ID }}
          SUBNET1: ${{ secrets.SUBNET1 }}
          SUBNET2: ${{ secrets.SUBNET2 }}
          ECS_SG_ID: ${{ secrets.ECS_SG_ID }}
          ASSIGN_PUBLIC_IP: ${{ secrets.ASSIGN_PUBLIC_IP }}
        run: |
          set -euo pipefail
          REG="${{ steps.login.outputs.registry }}"
          REPO="${ECR_PREFIX}${{ inputs.service }}"
          IMAGE="$REG/$REPO:latest"

          aws cloudformation deploy \
            --template-file infra/service.yml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              BaseStackName="$BASE_STACK" \
              ServiceName="${{ inputs.service }}" \
              ContainerImage="$IMAGE" \
              ListenerPriority="${{ inputs.listener_priority }}" \
              VpcId="$VPC_ID" \
              Subnet1="$SUBNET1" \
              Subnet2="$SUBNET2" \
              EcsTaskSecurityGroupId="$ECS_SG_ID" \
              AssignPublicIp="$ASSIGN_PUBLIC_IP"