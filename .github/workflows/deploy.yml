name: Deploy asnsub API (dev auto / stg-prod manual)

    on:
      push:
        branches: [ main ]
        paths:
          - "services/**"
          - ".github/workflows/deploy.yml"
      workflow_dispatch:
        inputs:
          service:
            description: "deploy service name (hindp / hinfl / hinpr ...) 空なら差分検知"
            required: false
            type: string
          env:
            description: "deploy environment"
            required: true
            default: dev
            type: choice
            options: [dev, stg, prod]

    permissions:
      id-token: write
      contents: read

    env:
      ECR_PREFIX: asnsub-
      STACK_PREFIX: asnsub-
      BASE_STACK_PREFIX: asnsub-base

    jobs:
      detect:
        runs-on: ubuntu-latest
        outputs:
          matrix: ${{ steps.out.outputs.matrix }}
          deploy_env: ${{ steps.out.outputs.deploy_env }}
        steps:
          - uses: actions/checkout@v4
          - id: out
            shell: bash
            run: |
              set -e
              if [[ "${{ github.event_name }}" == "push" ]]; then
                ENV="dev"
              else
                ENV="${{ inputs.env }}"
              fi

              if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.service }}" ]]; then
                SERVICES="${{ inputs.service }}"
              else
                SERVICES=$(git diff --name-only HEAD~1 HEAD | grep '^services/' | cut -d/ -f2 | sort -u | tr '
' ' ')
              fi

              # 除外
              SERVICES=$(echo "$SERVICES" | tr ' ' '
' | sed '/^$/d' | grep -v '^backup$' | sort -u | tr '
' ' ')

              JSON='{"include":['
              FIRST=1
              for s in $SERVICES; do
                [[ $FIRST -eq 0 ]] && JSON+="," 
                JSON+="{"service":"$s"}"
                FIRST=0
              done
              JSON+=']}'

              echo "matrix=$JSON" >> $GITHUB_OUTPUT
              echo "deploy_env=$ENV" >> $GITHUB_OUTPUT

      deploy:
        needs: detect
        if: ${{ fromJson(needs.detect.outputs.matrix).include[0] != null }}
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

        concurrency:
          group: deploy-${{ matrix.service }}-${{ needs.detect.outputs.deploy_env }}

        defaults:
          run:
            working-directory: services/${{ matrix.service }}

        steps:
          - uses: actions/checkout@v4

          - name: Configure AWS credentials (OIDC)
            uses: aws-actions/configure-aws-credentials@v4
            with:
              role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
              aws-region: ${{ secrets.AWS_REGION }}

          - name: Login to Amazon ECR
            id: login-ecr
            uses: aws-actions/amazon-ecr-login@v2

          - name: Ensure ECR repo
            shell: bash
            run: |
              aws ecr describe-repositories --repository-names ${ECR_PREFIX}${{ matrix.service }} >/dev/null 2>&1                 || aws ecr create-repository --repository-name ${ECR_PREFIX}${{ matrix.service }} >/dev/null

          - name: Build and push Docker image
            shell: bash
            run: |
              REG=${{ steps.login-ecr.outputs.registry }}
              REPO=${ECR_PREFIX}${{ matrix.service }}
              docker build -t $REG/$REPO:latest .
              docker push $REG/$REPO:latest

          - name: Deploy CloudFormation (Service Stack)
            shell: bash
            env:
              STACK_NAME: ${STACK_PREFIX}${{ matrix.service }}-${{ needs.detect.outputs.deploy_env }}
              BASE_STACK: ${BASE_STACK_PREFIX}-${{ needs.detect.outputs.deploy_env }}
              VPC_ID: ${{ secrets.VPC_ID }}
              SUBNET1: ${{ secrets.SUBNET1 }}
              SUBNET2: ${{ secrets.SUBNET2 }}
              ECS_SG_ID: ${{ secrets.ECS_SG_ID }}
              ASSIGN_PUBLIC_IP: ${{ secrets.ASSIGN_PUBLIC_IP }}
            run: |
              REG=${{ steps.login-ecr.outputs.registry }}
              REPO=${ECR_PREFIX}${{ matrix.service }}
              IMAGE=$REG/$REPO:latest

              aws cloudformation deploy                 --template-file infra/service.yml                 --stack-name $STACK_NAME                 --capabilities CAPABILITY_NAMED_IAM                 --no-fail-on-empty-changeset                 --parameter-overrides                   BaseStackName=$BASE_STACK                   ServiceName=${{ matrix.service }}                   ContainerImage=$IMAGE                   AssignPublicIp=$ASSIGN_PUBLIC_IP                   VpcId=$VPC_ID                   Subnet1=$SUBNET1                   Subnet2=$SUBNET2                   EcsTaskSecurityGroupId=$ECS_SG_ID
